id: partner-analytics-vm-memory-floor
service: partner-analytics
env: staging
claim: "partner-analytics-vm (worker BBIX ingest + MySQL) RUNNING dengan RAM >= 16 GB. Jangan downsize RAM di bawah ini tanpa memangkas innodb_buffer_pool_size + ukur ulang puncak worker"
belief_source: "Verifikasi live 2026-11-20: custom-8-16384; systemd MemoryPeak partner-ingest 6.4 GiB (6 hari, termasuk page cache); mysqld RSS ~1.35 GB dgn innodb_buffer_pool_size 11 GiB; riwayat OOM-kill harian 13-24 Okt 2026 (python3 ~14.4 GB RSS), nihil sejak 25 Okt; CPU 30 hari p99 3.8%, puncak 5-menit 43% (job harian ~07:00 UTC, ~9 menit)"
note: "vCPU sengaja TIDAK dikunci (kandidat downsize CPU: e2-highmem-2 = 2 vCPU / 16 GB). Kalau RAM sengaja diturunkan (mis. 12 GB setelah buffer pool dipangkas), update memory_mb_min di sini. IP eksternal static: partner-analytics-ip."
check:
  tool: gcp_instance_shape
  args:
    project: tokobuah-staging-499001
    zone: asia-southeast1-b
    instance: partner-analytics-vm
expect:
  status: RUNNING
  memory_mb_min: 16384
severity: warn
recheck: 24h
retry: 1
created: 2026-11-20
last_verified: null
status: active
