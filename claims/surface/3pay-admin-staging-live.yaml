claim: "Panel 3Pay superadmin staging hidup di https://3pay-admin.stagingtokobuah.xyz (Cloud Run fe-3pay-superadmin via domain mapping, sertifikat Google-managed) — 2xx/3xx, bukan 4xx/5xx/TLS error"
belief_source: "Dibuat 2026-11-23 (sesi 3pay-panel staging setup): domain mapping 3pay-admin.stagingtokobuah.xyz → fe-3pay-superadmin (asia-southeast1, project tokobuah-staging-499001), CNAME Cloudflare 3pay-admin → ghs.googlehosted.com (DNS-only). Probe live 16:49 WIB: HTTP 200, cert CN=3pay-admin.stagingtokobuah.xyz issuer Google Trust Services WR3."
note: "RISIKO DITERIMA (2026-11-23, testing): superadmin publik, hanya login aplikasi, dan memanggil /v1/admin wl-be lewat LB internal sehingga allowlist Cloudflare /v1/admin TIDAK berlaku. IAP sempat dipasang lalu dilepas (error 604; lihat kartu retired 3pay-admin-staging-iap-gate). Mitigasi: password kuat + 2FA akun superadmin staging. Production WAJIB LB + IAP/Cloud Armor. Surface baru (input radar sentinel). Tanpa LB/Cloud Armor — staging memakai Cloud Run domain mapping (pola tripay-fe/poweronepay). Deploy otomatis dari push ke dev-superadmin (trigger fe-3pay-superadmin-staging). Sampai deploy pertama: image placeholder kosong tokobuah/3pay-panel-placeholder:v1 (busybox, halaman 139 byte tanpa info project); setelah deploy pertama '/' = halaman login (200). DNS-only wajib: proxied (orange) dapat memblokir penerbitan/perpanjangan sertifikat Google. TLS error / 000 = cek domain mapping & CNAME; 404 Google = mapping hilang."
check:
  tool: http_probe_status
  args:
    url: "https://3pay-admin.stagingtokobuah.xyz/"
expect:
