id: 3pay-panel-no-secret-tracked
service: 3pay-panel
env: both
claim: "Repo 3pay-panel TIDAK mem-track berkas secret (.env selain .env.example, secret.yaml/ts, .pem, .key, .p12) — 0 file"
belief_source: "Diverifikasi 2026-11-23: git ls-tree di ujung main-superadmin, main-reseller, main-merchant, dev-superadmin, dev-reseller, dev-merchant → satu-satunya file cocok pola adalah .env.example (dikecualikan)."
note: "Kartu invariant bootstrap. git ls-files hanya melihat branch yang sedang ter-checkout di ~/tokobuah/3pay-panel (repo ini punya 3 portal di branch terpisah). Panel by design tidak punya secret runtime: env-nya hanya BE_UPSTREAM, BE_API_HOSTNAME, PGA_HOSTNAME (hostname/URL). Hanya count, bukan konten (§5)."
check:
  tool: git_ls_files_count
  args:
    repos:
      - "~/tokobuah/3pay-panel"
    pattern: '(^|/)\.env(?!\.example)|(^|/)secret\.(ya?ml|ts)$|\.pem$|\.key$|\.p12$'
expect:
  count: 0
severity: critical
recheck: 24h
retry: 1
local_only: true
created: 2026-11-23
last_verified: null
status: active
