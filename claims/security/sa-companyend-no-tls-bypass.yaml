id: sa-companyend-no-tls-bypass
service: superadmin
env: staging
claim: "Repo superadmin-companyend: TIDAK ADA penyetelan NODE_TLS_REJECT_UNAUTHORIZED di kode src/** maupun di konfigurasi build/deploy (cloudbuild*.yaml)"
belief_source: "Live-verified 2026-11-28 (sesi hardening): 43 route file menyetel process.env.NODE_TLS_REJECT_UNAUTHORIZED='0' + env var diset di service staging via --update-env-vars (verified gcloud run services describe); commit d0e0417 menghapus keduanya; env var lama di service di-clear via Run API patch pada deploy 2026-11-28"
note: "Penyimpangan TLS = MITM antar BFF dan engine internal bisa mencuri Bearer JWT / memalsukan response balance. Jika engine di-migrasi ke https dengan CA privat, solusi yang benar adalah NODE_EXTRA_CA_CERTS, bukan disable verifikasi."
check:
  tool: repo_grep_count
  args:
    repo: "~/tokobuah/superadmin-companyend"
    pattern: "NODE_TLS_REJECT_UNAUTHORIZED"
    files: "src/**"
expect:
  count: 0
severity: critical
recheck: 24h
retry: 2
created: 2026-11-28
last_verified: null
status: active
