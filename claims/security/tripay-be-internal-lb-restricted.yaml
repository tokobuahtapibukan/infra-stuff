id: tripay-be-internal-lb-restricted
service: tripay
env: staging
claim: "LB internal wl-be staging (Service tripay/tripay-be-internal) di-pin ke 10.10.16.52 dengan loadBalancerSourceRanges 10.10.32.0/28 (connector vpc-run-bridge, dipakai Cloud Run fe-3pay-*); jalur BARU ke wl-be hanya dari connector itu"
belief_source: "Dibuat & di-apply 2026-11-23 (sesi 3pay-panel staging): kubectl get svc → EXTERNAL-IP 10.10.16.52; firewall GKE k8s-fw-a9548e6b6591a48ac8ee101df181a9f3 source 10.10.32.0/28 tcp:80; alamat statis tripay-be-internal-ip RESERVED→IN_USE. Manifest: company-deployment-key staging/tripay/service-internal.yaml (commit 1a7a90f)."
note: "Alasan: Cloudflare iknstaging.com memblokir /v1/admin/* dari IP non-allowlist (VPN sg-vpn-gateway-dev-1 34.2.153.31 lolos), sehingga panel 3pay memanggil wl-be lewat VPC. wl-be mempercayai header cf-connecting-ip → jangan perlebar loadBalancerSourceRanges (drift). KOREKSI 2026-11-23 (cek firewall live): LB ini JUGA terjangkau dari semua pod cluster (gke-...-all 10.248.0.0/17) dan semua VM/node di client-gke-subnet termasuk VPN gateway (gke-...-vms 10.10.16.0/20); sumber-sumber itu memang sudah bisa ke pod wl-be langsung sebelumnya, jadi bukan eksposur baru. allow-vpc-connector-ingress juga mencakup 10.10.12.0/28 (connector Jakarta) tapi LB regional tanpa global access sehingga tidak terjangkau dari sana. Per 2026-11-23 tidak ada service Cloud Run lain di asia-southeast1 yang memakai vpc-run-bridge; service baru yang ikut memakai connector itu otomatis bisa mencapai LB ini — review dulu. Kartu ini mengecek MANIFEST (2 baris: IP pin + source range); engine belum punya cek live Service LB."
check:
  tool: repo_grep_count
  args:
    repo: "~/tokobuah/company-deployment-key"
    files: "staging/tripay/service-internal.yaml"
    pattern: "^\\s*(loadBalancerIP:\\s*\"?10\\.10\\.16\\.52|-\\s*\"?10\\.10\\.32\\.0/28)"
expect:
  count: 2
severity: warn
recheck: 24h
retry: 1
local_only: true
created: 2026-11-23
last_verified: null
status: active
