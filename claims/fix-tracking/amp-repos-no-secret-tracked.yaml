id: amp-repos-no-secret-tracked
service: amp
env: both
claim: "Repo AMP dan tenant-registry-go TIDAK mem-track berkas secret (0 file)"
belief_source: "Recon git ls-files 2026-11-21"
note: "Kartu invariant: count 0 = sehat. Hanya count, bukan konten (§5). Manifest/secret AMP hidup di company-deployment-key."
check:
  tool: git_ls_files_count
  args:
    repos:
      - "~/tokobuah/AMP"
      - "~/tokobuah/tenant-registry-go"
    pattern: '(^|/)\.env(?!\.example)|(^|/)secret\.(ya?ml|ts)$|\.pem$|\.key$|\.p12$'
expect:
  count: 0
severity: critical
recheck: 24h
retry: 1
local_only: true
created: 2026-11-21
last_verified: null
status: active
