id: core-repos-no-secret-tracked
service: multi
env: both
claim: "Repo inti (auth/transactional/backend-pg/game-engine/user-site/dataset/content/domain) TIDAK mem-track berkas secret (0 file)"
belief_source: "Recon git ls-files 2026-11-20"
note: "Kartu invariant: count 0 = sehat. Muncul 1 file secret baru = drift critical. Hanya count, bukan konten (§5)."
check:
  tool: git_ls_files_count
  args:
    repos:
      - "~/tokobuah/auth-engine-go"
      - "~/tokobuah/transactional-engine-go"
      - "~/tokobuah/backend-pg"
      - "~/tokobuah/game-engine"
      - "~/tokobuah/user-site"
      - "~/tokobuah/dataset-engine"
      - "~/tokobuah/content-management"
      - "~/tokobuah/domain-management"
    pattern: '(^|/)\.env(?!\.example)|(^|/)secret\.(ya?ml|ts)$|\.pem$|\.key$|\.p12$'
expect:
  count: 0
severity: critical
recheck: 24h
retry: 1
local_only: true
created: 2026-11-20
last_verified: null
status: active
